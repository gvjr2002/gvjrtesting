<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Intentionally weak CSP -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'unsafe-inline' *;">

    <title>SmartCode Validation Test Page</title>

    <!-- Missing referrer policy -->
    <meta name="referrer" content="unsafe-url">

    <!-- Start VWO Async SmartCode -->
    <link rel="preconnect" href="https://dev.visualwebsiteoptimizer.com" />

    <script type="text/javascript" id="vwoCode">
        /* PASTE THE PROVIDED VWO SMARTCODE HERE */
    </script>

    <!-- Duplicate SmartCode -->
    <script type="text/javascript" id="vwoCodeDuplicate">
        console.log("Duplicate VWO SmartCode");
    </script>

    <!-- Blocking Script (No async/defer) -->
    <script src="https://cdn.example.com/blocking.js"></script>

    <!-- Invalid Script Type -->
    <script type="application/invalid-javascript">
        console.log("Invalid type");
    </script>

    <!-- Syntax Error -->
    <script>
        function syntaxErrorTest() {
            console.log("missing brace"
        }
    </script>

    <!-- Broken Third Party Loader -->
    <script async src="https://nonexistent-third-party-loader.com/sdk.js"></script>

    <!-- Invalid Custom URL -->
    <script src="https://invalid-domain.invalid/sdk.js"></script>

</head>

<body>

<h1>SmartCode Validation Test</h1>

<!-- Invalid Cookie -->
<script>
document.cookie = "testCookie=; expires=InvalidDate; path=/";
</script>

<!-- Cookie Consent Issue -->
<script>
window.cookieConsent = false;
</script>

<!-- Network Request Failure -->
<script>
fetch("https://invalid-api.example.invalid/settings")
    .then(r => r.json())
    .then(console.log)
    .catch(console.error);
</script>

<!-- Timeout Tolerance Failure -->
<script>
setTimeout(function () {
    console.error("Settings timeout exceeded");
}, 5000);
</script>

<!-- Script incorrectly placed inside body -->
<script src="https://cdn.example.com/body-script.js"></script>

<!-- Next.js compatibility issue -->
<div id="__next">
    <script>
        document.write("<p>Hydration mismatch example</p>");
    </script>
</div>

<!-- Rocket Loader incompatibility -->
<script data-cfasync="true">
    document.write("Rocket Loader conflict");
</script>

<!-- Referrer Policy Validation Failure -->
<img src="https://example.com/tracker.gif"
     referrerpolicy="unsafe-url">

<!-- SmartCode Version Mismatch -->
<script>
window._vwo_code = {
    getVersion: function() {
        return "1.0";
    }
};
</script>

<!-- CSP Violation -->
<script>
eval("console.log('CSP violation')");
</script>

<!-- Another JS Syntax Error -->
<script>
let x = ;
</script>

</body>
</html>
